# Konfigurasi Koneksi Autopilot VTOL
# Pilih profil aktif yang ingin digunakan untuk koneksi MAVROS (ArduPilot/PX4)

# Profil yang tersedia:
# - tcp: Simulasi SITL ArduPilot / Mission Planner (default port: 5762)
# - serial: Koneksi fisik Pixhawk ke Companion Computer (Raspberry Pi) via USB/Serial (default: /dev/ttyAMA0 pada baudrate 921600)
#
# CATATAN: Mengubah active_profile di sini sudah cukup — vision node (aruco_receiver)
# akan otomatis menyesuaikan profil kameranya (tcp → sitl, serial → raspi).

active_profile: "tcp"

profiles:
  tcp:
    fcu_url: "tcp://127.0.0.1:5762"
  serial:
    fcu_url: "/dev/ttyAMA0:921600"

# ==============================================================================
# Konfigurasi MAVLink UDP Forwarding (GCS Bridge)
# MAVROS akan membuka server UDP sehingga GCS eksternal (QGC / Mission Planner)
# bisa connect tanpa perlu akses langsung ke FCU/SITL.
#
# Format gcs_url:
# Format gcs_url yang valid di MAVROS:
#   udp://:14550@          →  MAVROS listen/bind di port ini (GCS connect ke sini) — trailing '@' = server mode
#   udp://<ip>:<port>      →  MAVROS push ke IP/port GCS secara aktif (client mode)
#   ""                     →  Nonaktifkan forwarding (string kosong)
#
# Rekomendasi port:
#   14550  →  port standar GCS (QGroundControl / Mission Planner)
#   14551  →  port alternatif jika 14550 sudah dipakai QGC lokal di mesin SITL
# ==============================================================================
mavlink_forward:
  enabled: true           # Set false untuk menonaktifkan GCS forwarding (semua profil)
  gcs_url: "udp://:14550@"

# Parameter PID untuk Centering ArUco (Menyerupai commit 51fe8a59)
pid_centering:
  kp_roll: 10.0         # Proportional gain untuk Roll (mengoreksi deviasi X)
  ki_roll: 0.1          # Integral gain untuk Roll
  kd_roll: 2.0          # Derivative gain untuk Roll (untuk redam overshoot & jitter)
  kp_pitch: 15.0        # Proportional gain untuk Pitch (mengoreksi deviasi Y)
  ki_pitch: 0.1         # Integral gain untuk Pitch
  kd_pitch: 2.0         # Derivative gain untuk Pitch (untuk redam overshoot & jitter)
  enable_yaw_alignment: false # Set true untuk aktifkan koreksi Yaw, false = fokus Roll/Pitch saja
  kp_yaw: 5.0           # Proportional gain untuk Yaw
  ki_yaw: 0.2           # Integral gain untuk Yaw
  kd_yaw: 8.0           # Derivative gain untuk Yaw
  max_override: 80      # Deviasi maksimum dari 1500 (nilai RC aman: [1420, 1580])
  max_yaw_override: 30  # Deviasi maksimal RC4 (Yaw) dari 1500
  max_throttle_override: 0 # Deviasi maksimal RC3 (Throttle) dari 1500
  yaw_error_threshold: 0.085 # Batas toleransi error Yaw dalam radian
  error_threshold: 0.10 # Batas toleransi error (10% dari setengah ukuran layar, toleransi ideal 10 cm)
  centering_duration: 3.0 # Waktu stabil (detik) di bawah threshold sebelum meluncurkan pendaratan
  marker_lost_timeout: 8.0 # Waktu maksimal marker hilang (detik) sebelum failsafe LAND dipicu
  deadzone_bias: 22.0   # Minimum RC kick offset untuk Roll/Pitch (menembus deadzone ArduPilot ~20 PWM + 2 PWM margin)
  deadzone_bias_yaw: 25.0 # Minimum RC kick offset untuk Yaw
  # Jeda (detik) antara pemberian perintah RC berturut-turut
  control_interval: 1.0      # Jeda 1.0s per iterasi di fase sequential (PITCH_ONLY & ROLL_ONLY)
  control_interval_fine: 0.8 # Jeda 0.8s per iterasi di fase CENTERING (fine-tuning cepat & responsif)
  # Sequential axis mode: koreksi Pitch (Y) dulu hingga stabil, lalu Roll (X), lalu kedua axis sekaligus
  sequential_axis_mode: true  # true = PITCH_ONLY → ROLL_ONLY → CENTERING | false = langsung CENTERING (keduanya)
  # Error axis flip — untuk koreksi arah sumbu kamera vs body drone di hardware nyata.
  # SITL: false/false (konvensi pixel OpenCV sesuai dengan gerak drone simulasi)
  # Real drone: flip_error_y: true jika pitch bergerak berlawanan arah dari yang diharapkan
  #             flip_error_x: true jika roll bergerak berlawanan arah dari yang diharapkan
  flip_error_x: false   # true = balik arah koreksi Roll (sumbu X)
  flip_error_y: false   # true = balik arah koreksi Pitch (sumbu Y)
  # Active altitude hold selama centering (P-controller pada RC3/throttle)
  # Menggantikan RC3=1500 hardcoded agar drone tidak drift turun karena LOITER bias di SITL
  hold_altitude: true           # true = aktifkan altitude hold aktif, false = pasif (RC3=1500)
  # hover_base: RC3 yang menghasilkan zero climb rate di LOITER (dikalibrasi dari SITL)
  # Observasi: drone settle stabil di RC3=1575-1577 → hover_base = 1576
  # Kalkulasi: steady-state alt=1.67m, error=0.33m, correction=80*0.33=26.4, RC3=1550+26=1576
  # Untuk drone real (serial): set ke 1500 (THR_MID biasanya lebih baik di hardware)
  hover_base: 1576
  kp_altitude: 80.0             # P-gain: error 1m → koreksi ±80 (menembus deadband LOITER)
  max_throttle_correction: 150  # Batas koreksi maksimal (RC3 antara 1426-1726)

# Parameter Lepas Landas Otonom (Takeoff)
takeoff:
  altitude: 1.2            # Ketinggian lepas landas otonom (meter) sebelum centering
  max_throttle_override: 100 # Deviasi maksimal RC3 (Throttle) dari 1500 (1500 + 100 = 1600 PWM)
  throttle: 1600             # Nilai PWM Throttle saat Climb (1600 PWM)
  slowdown_zone: 0.2       # Zone pengurangan throttle sebelum target altitude (meter)

