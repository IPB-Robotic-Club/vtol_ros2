# Konfigurasi Koneksi Autopilot VTOL
# Pilih profil aktif yang ingin digunakan untuk koneksi MAVROS (ArduPilot/PX4)

# Profil yang tersedia:
# - tcp: Simulasi SITL ArduPilot / Mission Planner (default port: 5762)
# - serial: Koneksi fisik Pixhawk ke Companion Computer (Raspberry Pi) via USB/Serial (default: /dev/ttyACM0 pada baudrate 921600)

active_profile: "tcp"

profiles:
  tcp:
    fcu_url: "tcp://127.0.0.1:5762"
  serial:
    fcu_url: "/dev/ttyACM0:921600"

# Parameter PID untuk Centering ArUco
pid_centering:
  kp_roll: 5.0          # Proportional gain untuk Roll (mengoreksi deviasi X)
  ki_roll: 0.2          # Integral gain untuk Roll
  kd_roll: 8.0          # Derivative gain untuk Roll (untuk redam overshoot)
  kp_pitch: 5.0         # Proportional gain untuk Pitch (mengoreksi deviasi Y)
  ki_pitch: 0.2         # Integral gain untuk Pitch
  kd_pitch: 8.0         # Derivative gain untuk Pitch (untuk redam overshoot)
  kp_yaw: 3.0           # Proportional gain untuk Yaw (Heading)
  ki_yaw: 0.1           # Integral gain untuk Yaw
  kd_yaw: 4.0           # Derivative gain untuk Yaw
  max_override: 30      # Deviasi maksimum dari 1500 (nilai RC aman: [1470, 1530])
  max_yaw_override: 50  # Deviasi maksimal RC4 (Yaw) dari 1500
  yaw_error_threshold: 0.1 # Batas toleransi error Yaw dalam radian (~5.7 derajat)
  error_threshold: 0.08 # Batas toleransi error translasi
  centering_duration: 3.0 # Waktu stabil (detik) di bawah threshold sebelum meluncurkan pendaratan
  marker_lost_timeout: 3.0 # Waktu maksimal marker hilang (detik) sebelum failsafe LAND dipicu
  deadzone_bias: 25.0   # Kompensasi deadzone RC (nilai bias offset)

# Parameter Lepas Landas Otonom (Takeoff)
takeoff:
  altitude: 1.5    # Ketinggian lepas landas otonom (meter) sebelum centering
  throttle: 1700   # Thrust (RC3) yang digunakan saat proses lepas landas



