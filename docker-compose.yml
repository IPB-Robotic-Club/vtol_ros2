version: '3.8'

services:
  dev:
    build:
      context: .
      target: dev
    container_name: vtol_dev
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./workspace:/home/pilot/workspace
    stdin_open: true
    tty: true

  sbc:
    build:
      context: .
      target: sbc
    container_name: vtol_sbc
    network_mode: host
    privileged: true
    volumes:
      - ./workspace:/home/pilot/workspace
      - /dev:/dev
    stdin_open: true
    tty: true
    command: >
      sh -c "mavproxy.py --master=/dev/ttyACM0,921600 --streamrate=10 --out=udpin:0.0.0.0:14550 --out=udp:127.0.0.1:14555"
